name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check code quality
        run: python -m ruff check task1_nlp_cleaner.py task2_api_client.py tests

      - name: Check formatting
        run: python -m ruff format --check task1_nlp_cleaner.py task2_api_client.py tests

      - name: Run tests
        run: python -m pytest -q